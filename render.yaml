# Render blueprint for the FastAPI backend.
# Secrets are not stored here: Render asks for each `sync: false` value when the service is created.
services:
  - type: web
    name: restruct-warp-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL        # hosted Postgres connection string (e.g. from Neon)
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
