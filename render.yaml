# Render blueprint for the FastAPI backend.
# Secrets are not stored here: Render asks for each `sync: false` value when the service is created.
services:
  - type: web
    name: restruct-warp-api
    runtime: python
    plan: free
    # the a11y step installs the accessibility checker (axe-core); the app still runs if Node is missing
    buildCommand: pip install -r requirements.txt && (cd a11y && npm install --omit=dev || echo "a11y checker not installed")
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL        # hosted Postgres connection string (e.g. from Neon)
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: DEV_ACCOUNT_EMAIL      # optional developer login (unlimited credits)
        sync: false
      - key: DEV_ACCOUNT_PASSWORD
        sync: false
